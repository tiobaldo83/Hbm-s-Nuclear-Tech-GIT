# Сборка ветки ru-radiation-port (перенос радиации с 1.12.2, русский перевод)
name: RU port build

on:
  push:
    branches: [ "ru-radiation-port" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Version
      run: |
        days=$(( ($(date +%s) - $(date -d 2010-10-10 +%s)) / 86400 ))
        sed -i "s/public static final String VERSION = \".*\";/public static final String VERSION = \"1.0.27 BETA ($days) RU-port\";/" src/main/java/com/hbm/lib/RefStrings.java
        sed -i "s/mod_build_number=.*/mod_build_number=$days/" gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload jar
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ntm-ru-port
        path: ./build/libs
        retention-days: 30
